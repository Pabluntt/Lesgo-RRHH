services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-lesgo-rrhh-local-demo-secret-change-me}
    ports:
      - "3001:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped
